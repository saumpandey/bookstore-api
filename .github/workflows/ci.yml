name: CI

# Run this workflow whenever code is pushed to main or a pull request targets main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Fetch the repository source code so the workflow can build and test it.
      - uses: actions/checkout@v4

      # Install Java 17 and Maven dependencies for the project.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Run the unit tests for the application.
      - name: Unit tests
        run: mvn -B test

      # Run integration tests and generate the JaCoCo coverage report.
      - name: Integration tests + coverage report
        run: mvn -B verify

      # Save test result files as workflow artifacts for debugging and review.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      # Publish the generated coverage HTML report as an artifact.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # Save the built JAR file so it can be used by later jobs or downloaded manually.
      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      # Pull the code again in this job because it runs independently after the build job.
      - uses: actions/checkout@v4

      # Build the Docker image for the application using the current commit SHA as the tag.
      - name: Build Docker image
        run: docker build -t bookstore-api:${{ github.sha }} .

      # Start the container and verify the app becomes healthy before marking the job successful.
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8080:8080 bookstore-api:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health | grep -q UP; then
              echo "App is healthy"; exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

      # Uncomment to publish to GitHub Container Registry on main
      # - name: Login to GHCR
