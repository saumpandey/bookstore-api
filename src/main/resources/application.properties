spring.application.name=bookstore-api
server.port=8080

# In-memory H2 database (no external DB needed for CI)
spring.datasource.url=jdbc:h2:mem:bookstore;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Health endpoint for CI/CD smoke tests and container health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
